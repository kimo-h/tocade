<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 辦公室</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#23211c;--mute:#6f6a5e;--line:#e2dccd;--acc:#2f6f5e;--accbg:#dcece6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#212326;--ink:#ece9e1;--mute:#9c988c;--line:#34363a;--acc:#6fc4ab;--accbg:#22382f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#212326;--ink:#ece9e1;--mute:#9c988c;--line:#34363a;--acc:#6fc4ab;--accbg:#22382f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0}h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.stat{font-size:13px;color:var(--mute)}
.scene{position:relative;width:100%;aspect-ratio:8/5;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#2b2f63}
.scene img,.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene canvas{cursor:pointer}
.bub{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;font-size:clamp(8px,1.3vw,12px);background:#e6f7fb;color:#12424c;border:1px solid #7cc4d4;border-radius:8px;padding:0 6px;opacity:0;transition:opacity .25s;z-index:2}
.bub.show{opacity:1}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mute);padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.sel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.sel.on{border-color:var(--acc);background:var(--accbg)}
.sel i{font-style:normal;color:var(--acc);font-weight:700;margin-right:3px}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.panel{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.box h2{font-size:15px;margin:0 0 10px}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;text-align:left}
.chip:hover{color:var(--acc);border-color:var(--acc)}
.go{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.out{white-space:pre-wrap;word-break:break-word;min-height:150px;max-height:420px;overflow:auto}
.ph{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.log{margin-top:14px}
.li{padding:8px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer;display:flex;gap:8px}
.li:first-of-type{border-top:0}.li b{white-space:nowrap}.li span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--mute);margin-top:10px}
#ed{margin-bottom:14px}
[hidden]{display:none!important}
</style>
</head>

 ctx.lineCap="round";ctx.beginPath();ctx.moveTo(A.a[0],A.a[1]);ctx.quadraticCurveTo(A.c[0],A.c[1],A.b[0],A.b[1]);

function drawLines(t){
 if(RELAY&&RELAY.end&&t-RELAY.end>1.6)RELAY=null;

   else drawArc(A,.3*fade,1.3,t,0,0,0,[5,6],true)}

  const env=Math.min(1,age/.4,(f.dur-age)/.6);drawArc(f.A,.6*env,1.4,t,2,.5,f.t0%1,null,false)}}
